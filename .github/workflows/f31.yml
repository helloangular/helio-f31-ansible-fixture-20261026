{
  "concurrency": {
    "cancel-in-progress": false,
    "group": "f31-local-targets"
  },
  "jobs": {
    "catalog": {
      "name": "F31 catalog",
      "secrets": {
        "NEXUS_PASSWORD": "${{ secrets.NEXUS_PASSWORD }}",
        "NEXUS_USERNAME": "${{ secrets.NEXUS_USERNAME }}"
      },
      "uses": "helloangular/helio-f31-ansible-fixture-20261026/.github/workflows/f31-template.yml@6f8072421e82c0af6c3987388c4b343270bbfcd8",
      "with": {
        "artifact_digest": "${{ inputs.artifact_digest }}",
        "artifact_uri": "${{ inputs.artifact_uri }}",
        "helio_target_environment": "${{ inputs.helio_target_environment }}",
        "version": "${{ inputs.version }}"
      }
    }
  },
  "name": "F31 catalog reference",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "artifact_digest": {
          "default": "",
          "type": "string"
        },
        "artifact_uri": {
          "default": "",
          "type": "string"
        },
        "helio_target_environment": {
          "default": "",
          "type": "string"
        },
        "version": {
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "actions": "read",
    "contents": "read"
  }
}
